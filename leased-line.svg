<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dedicated leased line connecting an office to a data centre over a private fibre link">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06132c"/><stop offset=".55" stop-color="#0b2854"/><stop offset="1" stop-color="#0a4a8a"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e4fa8"/><stop offset="1" stop-color="#0d2c61"/></linearGradient>
<linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#0b3b5c"/></linearGradient>
<filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
</defs>
<rect width="900" height="600" fill="url(#bg)"/><rect width="900" height="600" fill="url(#grid)"/>
<circle cx="450" cy="300" r="260" fill="#22d3ee" opacity=".06"/>
<!-- skyline silhouettes -->
<g fill="#ffffff" opacity=".05"><rect x="20" y="380" width="60" height="140"/><rect x="90" y="340" width="50" height="180"/><rect x="760" y="360" width="70" height="160"/><rect x="840" y="400" width="50" height="120"/></g>
<!-- ground -->
<rect x="0" y="470" width="900" height="130" fill="#05101f" opacity=".55"/>
<!-- office building (left) -->
<g transform="translate(95 215)">
<rect x="0" y="0" width="150" height="255" rx="8" fill="url(#bldA)" stroke="#60a5fa" stroke-opacity=".6" stroke-width="2"/>
<g fill="#bfe3ff" opacity=".85"><rect x="18" y="22" width="22" height="16" rx="2"/><rect x="64" y="22" width="22" height="16" rx="2"/><rect x="110" y="22" width="22" height="16" rx="2"/><rect x="18" y="58" width="22" height="16" rx="2"/><rect x="64" y="58" width="22" height="16" rx="2" opacity=".45"/><rect x="110" y="58" width="22" height="16" rx="2"/><rect x="18" y="94" width="22" height="16" rx="2" opacity=".45"/><rect x="64" y="94" width="22" height="16" rx="2"/><rect x="110" y="94" width="22" height="16" rx="2"/><rect x="18" y="130" width="22" height="16" rx="2"/><rect x="64" y="130" width="22" height="16" rx="2"/><rect x="110" y="130" width="22" height="16" rx="2" opacity=".45"/></g>
<rect x="55" y="190" width="40" height="65" rx="4" fill="#07152f"/>
<text x="75" y="-18" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" fill="#e0f2fe" letter-spacing="1.5">YOUR OFFICE</text>
</g>
<!-- data centre (right) -->
<g transform="translate(655 245)">
<rect x="0" y="0" width="150" height="225" rx="8" fill="url(#bldB)" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/>
<g><rect x="16" y="20" width="118" height="30" rx="5" fill="#06202f" stroke="#22d3ee" stroke-opacity=".5"/><rect x="16" y="62" width="118" height="30" rx="5" fill="#06202f" stroke="#22d3ee" stroke-opacity=".5"/><rect x="16" y="104" width="118" height="30" rx="5" fill="#06202f" stroke="#22d3ee" stroke-opacity=".5"/><rect x="16" y="146" width="118" height="30" rx="5" fill="#06202f" stroke="#22d3ee" stroke-opacity=".5"/></g>
<g fill="#4ade80"><circle cx="30" cy="35" r="4"/><circle cx="30" cy="77" r="4"/><circle cx="30" cy="119" r="4"/><circle cx="30" cy="161" r="4"/></g>
<g fill="#22d3ee"><rect x="48" y="32" width="50" height="6" rx="3"/><rect x="48" y="74" width="50" height="6" rx="3"/><rect x="48" y="116" width="50" height="6" rx="3"/><rect x="48" y="158" width="50" height="6" rx="3"/></g>
<text x="75" y="-18" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="20" fill="#cffafe" letter-spacing="1.5">DATA CENTRE</text>
</g>
<!-- dedicated fibre line -->
<path d="M245 440 C 350 440, 360 400, 450 400 S 560 440, 655 440" fill="none" stroke="#0a2a52" stroke-width="16" stroke-linecap="round"/>
<path id="p" d="M245 440 C 350 440, 360 400, 450 400 S 560 440, 655 440" fill="none" stroke="url(#beam)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
<path d="M245 440 C 350 440, 360 400, 450 400 S 560 440, 655 440" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 22"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.5s" repeatCount="indefinite"/></path>
<g fill="#fff" filter="url(#glow)"><circle r="6"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><circle r="6"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle></g>
<circle cx="245" cy="440" r="9" fill="#22d3ee"/><circle cx="655" cy="440" r="9" fill="#22d3ee"/>
<text x="450" y="378" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="13" fill="#a5f3fc" letter-spacing="3">PRIVATE FIBRE LINK</text>
<!-- labels -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">
<rect x="330" y="258" width="240" height="86" rx="16" fill="#06132c" fill-opacity=".8" stroke="#22d3ee" stroke-opacity=".7"/>
<text x="450" y="292" font-size="22" fill="#ffffff">1 : 1 DEDICATED</text>
<text x="450" y="318" font-size="14" fill="#7fe0f5" letter-spacing="2">SYMMETRICAL BANDWIDTH</text>
<text x="450" y="334" font-size="12" fill="#a5b4cf" letter-spacing="1.5">NO SHARING &#183; SLA BACKED</text>
</g>
</svg>
